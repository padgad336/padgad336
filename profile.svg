<svg
  fill="none"
  viewBox="0 0 1200 360"
  width="1200"
  height="360"
  xmlns="http://www.w3.org/2000/svg"
>
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          box-sizing: border-box;
        }

        @keyframes gradientMove {
          0% {
            background-position: 0% 50%;
          }
          50% {
            background-position: 100% 50%;
          }
          100% {
            background-position: 0% 50%;
          }
        }

        @keyframes wave {
          0%,
          60%,
          100% {
            transform: rotate(0deg);
          }
          10% {
            transform: rotate(14deg);
          }
          20% {
            transform: rotate(-8deg);
          }
          30% {
            transform: rotate(14deg);
          }
          40% {
            transform: rotate(-4deg);
          }
          50% {
            transform: rotate(10deg);
          }
        }

        @keyframes glow {
          0%,
          100% {
            opacity: 0.55;
            transform: scale(1);
          }
          50% {
            opacity: 0.9;
            transform: scale(1.08);
          }
        }

        @keyframes float {
          0%,
          100% {
            transform: translateY(0);
          }
          50% {
            transform: translateY(-8px);
          }
        }

        @keyframes blink {
          0%,
          45% {
            opacity: 1;
          }
          50%,
          100% {
            opacity: 0;
          }
        }

        .container {
          position: relative;
          width: 100%;
          height: 360px;
          overflow: hidden;

          display: flex;
          align-items: center;
          justify-content: center;

          color: #f8fafc;
          background:
            radial-gradient(
              circle at 15% 20%,
              rgba(0, 184, 28, 0.2),
              transparent 30%
            ),
            radial-gradient(
              circle at 85% 75%,
              rgba(34, 211, 238, 0.18),
              transparent 32%
            ),
            linear-gradient(
              125deg,
              #050816,
              #071a20,
              #062c24,
              #07111f
            );

          background-size: 180% 180%;
          animation: gradientMove 14s ease infinite;

          font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Helvetica,
            Arial,
            sans-serif;
        }

        .grid {
          position: absolute;
          inset: 0;
          opacity: 0.16;

          background-image:
            linear-gradient(
              rgba(255, 255, 255, 0.08) 1px,
              transparent 1px
            ),
            linear-gradient(
              90deg,
              rgba(255, 255, 255, 0.08) 1px,
              transparent 1px
            );

          background-size: 42px 42px;
          mask-image: linear-gradient(
            to bottom,
            transparent,
            black 25%,
            black 75%,
            transparent
          );
        }

        .orb {
          position: absolute;
          width: 220px;
          height: 220px;
          border-radius: 50%;
          filter: blur(70px);
          animation: glow 6s ease-in-out infinite;
        }

        .orb-left {
          top: -90px;
          left: -40px;
          background: rgba(0, 184, 28, 0.35);
        }

        .orb-right {
          right: -40px;
          bottom: -100px;
          background: rgba(34, 211, 238, 0.28);
          animation-delay: -3s;
        }

        .content {
          position: relative;
          z-index: 2;

          width: calc(100% - 100px);
          max-width: 1050px;

          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 50px;
        }

        .intro {
          flex: 1;
        }

        .status {
          display: inline-flex;
          align-items: center;
          gap: 9px;

          margin-bottom: 18px;
          padding: 7px 13px;

          color: #86efac;
          background: rgba(34, 197, 94, 0.08);
          border: 1px solid rgba(74, 222, 128, 0.25);
          border-radius: 999px;

          font-family: monospace;
          font-size: 13px;
          letter-spacing: 0.4px;
        }

        .status-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #22c55e;
          box-shadow: 0 0 12px #22c55e;
        }

        h1 {
          margin: 0;

          font-size: 54px;
          line-height: 1.08;
          letter-spacing: -2px;
          font-weight: 750;
        }

        .name {
          color: #4ade80;
          text-shadow: 0 0 30px rgba(74, 222, 128, 0.22);
        }

        .wave {
          display: inline-block;
          margin-left: 6px;

          transform-origin: 70% 70%;
          animation: wave 2.3s ease-in-out infinite;
        }

        .roles {
          margin: 17px 0 0;

          color: #cbd5e1;
          font-family: monospace;
          font-size: 19px;
          line-height: 1.55;
        }

        .prompt {
          color: #4ade80;
        }

        .cursor {
          display: inline-block;
          width: 9px;
          height: 20px;
          margin-left: 5px;
          vertical-align: -3px;
          background: #4ade80;
          animation: blink 1s steps(1) infinite;
        }

        .description {
          max-width: 680px;
          margin: 15px 0 0;

          color: #94a3b8;
          font-size: 15px;
          line-height: 1.65;
        }

        .visual {
          position: relative;
          width: 220px;
          height: 220px;
          flex: 0 0 220px;

          display: flex;
          align-items: center;
          justify-content: center;

          animation: float 5s ease-in-out infinite;
        }

        .ring {
          position: absolute;
          border: 1px solid rgba(74, 222, 128, 0.25);
          border-radius: 50%;
        }

        .ring-one {
          width: 210px;
          height: 210px;
        }

        .ring-two {
          width: 165px;
          height: 165px;
          border-color: rgba(34, 211, 238, 0.28);
        }

        .core {
          position: relative;
          z-index: 2;

          width: 118px;
          height: 118px;

          display: flex;
          align-items: center;
          justify-content: center;

          border: 1px solid rgba(74, 222, 128, 0.35);
          border-radius: 28px;

          color: #4ade80;
          background:
            linear-gradient(
              135deg,
              rgba(74, 222, 128, 0.13),
              rgba(34, 211, 238, 0.08)
            );
          box-shadow:
            0 0 45px rgba(34, 197, 94, 0.12),
            inset 0 0 25px rgba(255, 255, 255, 0.03);

          font-family: monospace;
          font-size: 42px;
          font-weight: 700;
          letter-spacing: -5px;
        }

        .node {
          position: absolute;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #4ade80;
          box-shadow: 0 0 15px #4ade80;
        }

        .node-one {
          top: 19px;
          left: 103px;
        }

        .node-two {
          right: 19px;
          bottom: 70px;
          background: #22d3ee;
          box-shadow: 0 0 15px #22d3ee;
        }

        .node-three {
          left: 28px;
          bottom: 45px;
        }

        @media (max-width: 800px) {
          .content {
            width: calc(100% - 50px);
          }

          h1 {
            font-size: 44px;
          }

          .visual {
            display: none;
          }
        }

        @media (prefers-reduced-motion: reduce) {
          .container,
          .wave,
          .orb,
          .visual,
          .cursor {
            animation: none;
          }
        }
      </style>

      <div class="container">
        <div class="grid"></div>
        <div class="orb orb-left"></div>
        <div class="orb orb-right"></div>

        <div class="content">
          <div class="intro">
            <div class="status">
              <span class="status-dot"></span>
              Available for building something useful
            </div>

            <h1>
              Hi, I'm <span class="name">PADGAD</span>
              <span class="wave">👋</span>
            </h1>

            <p class="roles">
              <span class="prompt">&gt;</span>
              Full-Stack Developer · AI Application Engineer
              <span class="cursor"></span>
            </p>

            <p class="description">
              Building enterprise applications, AI-powered platforms,
              knowledge systems and scalable backend infrastructure.
            </p>
          </div>

          <div class="visual">
            <div class="ring ring-one"></div>
            <div class="ring ring-two"></div>

            <span class="node node-one"></span>
            <span class="node node-two"></span>
            <span class="node node-three"></span>

            <div class="core">&lt;/&gt;</div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
